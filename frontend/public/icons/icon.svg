<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151b2e" />
      <stop offset="100%" stop-color="#1f122e" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#centerGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Mesh Connections -->
  <g filter="url(#neonGlow)">
    <line x1="165" y1="215" x2="256" y2="145" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.75" />
    <line x1="256" y1="145" x2="347" y2="215" stroke="#a855f7" stroke-width="6" stroke-opacity="0.75" />
    <line x1="347" y1="215" x2="256" y2="300" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.75" />
    <line x1="256" y1="300" x2="165" y2="215" stroke="#ec4899" stroke-width="6" stroke-opacity="0.75" />
    <line x1="165" y1="215" x2="347" y2="215" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="8 6" />
  </g>

  <!-- Video Camera Icon in Center -->
  <g transform="translate(196, 175) scale(1)">
    <!-- Camera Body -->
    <rect x="0" y="8" width="84" height="60" rx="14" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <!-- Camera Lens Cone -->
    <path d="M 82 24 L 116 10 C 119 9 122 11 122 15 L 122 61 C 122 65 119 67 116 66 L 82 52 Z" fill="#ffffff" />
    <!-- Lens Circle -->
    <circle cx="36" cy="38" r="15" fill="#1e293b" />
    <circle cx="36" cy="38" r="7" fill="#38bdf8" />
  </g>

  <!-- Glowing Mesh Nodes -->
  <!-- Node Left (Pink) -->
  <circle cx="165" cy="215" r="22" fill="#ec4899" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="165" cy="215" r="12" fill="#f43f5e" />
  <circle cx="165" cy="215" r="5" fill="#ffffff" />

  <!-- Node Top (Blue) -->
  <circle cx="256" cy="145" r="22" fill="#3b82f6" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="256" cy="145" r="12" fill="#38bdf8" />
  <circle cx="256" cy="145" r="5" fill="#ffffff" />

  <!-- Node Right (Purple) -->
  <circle cx="347" cy="215" r="22" fill="#a855f7" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="347" cy="215" r="12" fill="#c084fc" />
  <circle cx="347" cy="215" r="5" fill="#ffffff" />

  <!-- Node Bottom (Cyan) -->
  <circle cx="256" cy="300" r="22" fill="#06b6d4" opacity="0.3" filter="url(#neonGlow)" />
  <circle cx="256" cy="300" r="12" fill="#22d3ee" />
  <circle cx="256" cy="300" r="5" fill="#ffffff" />

  <!-- Audio Waves / Connection Arc at Bottom -->
  <path d="M 200 375 A 60 40 0 0 1 312 375" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  <path d="M 180 395 A 80 50 0 0 1 332 395" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
